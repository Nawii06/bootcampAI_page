name: Assemble integrated platform specification

on:
  workflow_dispatch:
  push:
    branches:
      - docs/integrated-platform-spec-v0.9.0
    paths:
      - "docs/integrated-platform-spec-v0.9.0/.parts/**"
      - ".github/workflows/assemble-integrated-platform-spec.yml"
  pull_request:
    branches:
      - main
    paths:
      - "docs/integrated-platform-spec-v0.9.0/.parts/**"
      - ".github/workflows/assemble-integrated-platform-spec.yml"

permissions:
  contents: write

jobs:
  assemble:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v4
        with:
          ref: docs/integrated-platform-spec-v0.9.0
          fetch-depth: 0

      - name: Reconstruct generator source
        run: |
          cat docs/integrated-platform-spec-v0.9.0/.parts/build_integrated_spec.py.b64.part-* \
            | tr -d '[:space:]' \
            | base64 --decode > docs/integrated-platform-spec-v0.9.0/build_integrated_spec.py
          sha256sum docs/integrated-platform-spec-v0.9.0/build_integrated_spec.py
          wc -l -c docs/integrated-platform-spec-v0.9.0/build_integrated_spec.py

      - name: Commit reconstructed generator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/integrated-platform-spec-v0.9.0/build_integrated_spec.py
          if git diff --cached --quiet; then
            echo "No generator changes to commit."
            exit 0
          fi
          git commit -m "chore(docs): materialize integrated specification generator"
          git push origin HEAD:docs/integrated-platform-spec-v0.9.0
