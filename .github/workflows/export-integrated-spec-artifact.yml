name: Export integrated specification artifact

on:
  push:
    branches:
      - docs/integrated-platform-spec-v0.9.0
    paths:
      - ".github/workflows/export-integrated-spec-artifact.yml"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/integrated-platform-spec-v0.9.0
      - name: Upload integrated specification files
        uses: actions/upload-artifact@v4
        with:
          name: integrated-platform-spec-v0.9.0
          path: |
            docs/integrated-platform-spec-v0.9.0/국립한국교통대학교_부트캠프AI_통합운영플랫폼_세부명세서_v0.9.0.docx
            docs/integrated-platform-spec-v0.9.0/국립한국교통대학교_부트캠프AI_통합운영플랫폼_세부명세서_v0.9.0.pdf
          if-no-files-found: error
          retention-days: 1
      - name: Publish run marker
        run: |
          echo "$GITHUB_RUN_ID" > docs/integrated-platform-spec-v0.9.0/artifact_run_id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/integrated-platform-spec-v0.9.0/artifact_run_id.txt
          git commit -m "chore(docs): record artifact workflow run" || exit 0
          git push origin HEAD:docs/integrated-platform-spec-v0.9.0
